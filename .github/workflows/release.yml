name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  MUSL_TARGET: x86_64-unknown-linux-musl
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build release tarball
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.MUSL_TARGET }}

      - name: Install musl-gcc (for fully static linking)
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build Rust backend (fully static musl)
        working-directory: ./backend
        run: |
          cargo build --release --target "${{ env.MUSL_TARGET }}"
          file target/${{ env.MUSL_TARGET }}/release/ts-sv-backend

      - name: Build static frontend
        working-directory: ./frontend
        run: |
          deno task build

      - name: Package release tarball
        run: |
          RELEASE_DIR="/tmp/ts-go-release"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR/backend"
          mkdir -p "$RELEASE_DIR/frontend"

          # Copy backend binary
          cp "backend/target/${{ env.MUSL_TARGET }}/release/ts-sv-backend" "$RELEASE_DIR/backend/"

          # Copy frontend static export
          cp -r frontend/out/* "$RELEASE_DIR/frontend/"

          # Create run.sh launcher
          cat > "$RELEASE_DIR/run.sh" << 'RUNSCRIPT'
#!/bin/bash
set -euo pipefail

BOLD='\033[1m'
GREEN='\033[0;32m'
YELLOW='\033[1;33m'
RED='\033[0;31m'
NC='\033[0m'

info()  { echo -e "${GREEN}[INFO]${NC} $*"; }
error() { echo -e "${RED}[ERROR]${NC} $*"; }

RELEASE_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
BINARY_PID=""
ACTUAL_PORT=""

cleanup() {
    info "Shutting down..."
    [ -n "$BINARY_PID" ] && kill "$BINARY_PID" 2>/dev/null && wait "$BINARY_PID" 2>/dev/null && info "  Stopped"
    exit 0
}
trap cleanup SIGINT SIGTERM EXIT

if [ ! -x "$RELEASE_DIR/backend/ts-sv-backend" ]; then
    error "Binary not found at backend/ts-sv-backend"
    exit 1
fi

export FRONTEND_DIR="$RELEASE_DIR/frontend"

info "Starting server (auto port detection)..."
"$RELEASE_DIR/backend/ts-sv-backend" &
BINARY_PID=$!

while read -t 3 line; do
    if [[ "$line" =~ ^__PORT__=([0-9]+)$ ]]; then
        ACTUAL_PORT="${BASH_REMATCH[1]}"
        break
    fi
done < <(tail --pid=$BINARY_PID -f /proc/$BINARY_PID/fd/1 2>/dev/null || sleep 1)

if [ -z "$ACTUAL_PORT" ]; then
    if ! kill -0 "$BINARY_PID" 2>/dev/null; then
        error "Server failed to start."
        exit 1
    fi
    sleep 1
    ACTUAL_PORT=$(ss -tlnp 2>/dev/null | grep "$BINARY_PID" | awk '{print $4}' | awk -F: '{print $NF}' | head -1)
fi

[ -z "$ACTUAL_PORT" ] && ACTUAL_PORT="8088"

IP=$(hostname -I 2>/dev/null | awk '{print $1}' || echo "localhost")

echo ""
info "============================================"
info "  App is running!"
info ""
info "  http://${IP}:${ACTUAL_PORT}"
info ""
info "  Press Ctrl+C to stop"
info "============================================"
echo ""

wait
RUNSCRIPT
          chmod +x "$RELEASE_DIR/run.sh"

          # Determine release name
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_NAME="ts-go-${TAG_NAME}"
          else
            RELEASE_NAME="ts-go-$(date +%Y%m%d_%H%M%S)"
          fi

          # Create tarball
          cd /tmp
          tar czf "${GITHUB_WORKSPACE}/${RELEASE_NAME}.tar.gz" "ts-go-release"
          cd "${GITHUB_WORKSPACE}"

          echo "RELEASE_NAME=${RELEASE_NAME}" >> "$GITHUB_ENV"
          echo "TARBALL=${RELEASE_NAME}.tar.gz" >> "$GITHUB_ENV"
          echo "Binary size: $(du -h "$RELEASE_DIR/backend/ts-sv-backend" | cut -f1)"
          echo "Tarball size: $(du -h "${RELEASE_NAME}.tar.gz" | cut -f1)"

      - name: Upload tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: ${{ env.TARBALL }}
          if-no-files-found: error

      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## CryoET Tilt Series Curator ${{ github.ref_name }}

            ### 📦 Download
            - `${{ env.TARBALL }}` — fully self-contained release tarball

            ### ✅ Features
            - **Fully static binary** — works on any Linux distribution (musl linked)
            - No Rust, Deno, or Node.js required at runtime
            - Just `tar xzf` and `./run.sh`

            ### 🔧 Usage
            ```bash
            tar xzf ${{ env.TARBALL }}
            cd ts-go-release
            ./run.sh
            ```

            Then open `http://<server-ip>:8088` in your browser.
          files: ${{ env.TARBALL }}
