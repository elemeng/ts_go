[package]
name = "ts-sv-backend"
version = "0.1.0"
edition = "2024"
description = "CryoET Tilt Series API - Axum backend"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image processing
image = "0.25"
mrc = "0.6"
ndarray = "0.17"

# Filesystem
walkdir = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
emdoc = { version = "0.2.1", features = ["serde"] }
